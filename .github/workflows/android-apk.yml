name: Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Check and build Lingua
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Ensure Android SDK packages
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0"'

      - name: Restore fixed debug signing key
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          LINGUA_DEBUG_KEYSTORE_BASE64: ${{ secrets.LINGUA_DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "$LINGUA_DEBUG_KEYSTORE_BASE64" ]]; then
            echo '::error::Missing LINGUA_DEBUG_KEYSTORE_BASE64. Restore the original signing key in repository Actions Secrets.'
            exit 1
          fi
          install -d -m 700 "$HOME/.android"
          printf '%s' "$LINGUA_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          echo "ORG_GRADLE_PROJECT_linguaDebugKeystore=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"

      - name: Test, lint and build APK
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug -PlinguaBuildNumber="$GITHUB_RUN_NUMBER" --no-daemon --console=plain

      - name: Verify and prepare update package
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          lingua_apk='app/build/outputs/apk/debug/app-debug.apk'
          lingua_metadata='app/build/outputs/apk/debug/output-metadata.json'
          lingua_output="$RUNNER_TEMP/lingua-apk"
          mkdir -p "$lingua_output"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$lingua_apk" > "$lingua_output/signature.txt"
          lingua_expected_cert="$(tr -d '[:space:]' < ci/debug-signing-cert.sha256)"
          lingua_actual_cert="$(awk -F': ' '/^Signer #1 certificate SHA-256 digest:/ {print $2}' "$lingua_output/signature.txt")"
          if [[ "$lingua_actual_cert" != "$lingua_expected_cert" ]]; then
            echo "Expected certificate: $lingua_expected_cert; actual certificate: $lingua_actual_cert"
            echo '::error::APK signing certificate does not match the original Lingua debug certificate.'
            exit 1
          fi
          lingua_expected_version=$((1000 + GITHUB_RUN_NUMBER))
          jq -e --argjson version "$lingua_expected_version" '.applicationId == "com.lingua.english.debug" and .elements[0].versionCode == $version' "$lingua_metadata"
          cp "$lingua_apk" "$lingua_output/Lingua-build-${GITHUB_RUN_NUMBER}.apk"
          lingua_apk_hash="$(sha256sum "$lingua_apk" | awk '{print $1}')"
          jq --arg commit "$GITHUB_SHA" --arg run "$GITHUB_RUN_ID" --arg apk "Lingua-build-${GITHUB_RUN_NUMBER}.apk" --arg hash "$lingua_apk_hash" --arg cert "$lingua_actual_cert" '{applicationId, versionCode: .elements[0].versionCode, versionName: .elements[0].versionName, apkName: $apk, apkSha256: $hash, signingCertificateSha256: $cert, commit: $commit, runId: $run}' "$lingua_metadata" > "$lingua_output/build-info.json"
          cd "$lingua_output"
          sha256sum ./*.apk > SHA256SUMS

      - name: Upload installable APK
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Lingua-build-${{ github.run_number }}
          path: ${{ runner.temp }}/lingua-apk/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Upload check reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Lingua-checks-${{ github.run_number }}
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/*.xml
            app/build/reports/lint-results-debug.*
          if-no-files-found: warn
          retention-days: 14

      - name: Remove signing key from runner
        if: always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: rm -f "$HOME/.android/debug.keystore"

  release:
    name: Publish app update
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download verified package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Lingua-build-${{ github.run_number }}
          path: update-package

      - name: Publish complete release for in-app updates
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          lingua_tag="build-${GITHUB_RUN_NUMBER}"
          lingua_version="$(jq -r '.versionName' update-package/build-info.json)"
          lingua_code="$(jq -r '.versionCode' update-package/build-info.json)"
          lingua_latest='true'
          lingua_previous_tag="$(gh release list --exclude-drafts --exclude-pre-releases --json isLatest,tagName --jq '.[] | select(.isLatest) | .tagName')"
          if [[ -n "$lingua_previous_tag" ]]; then
            mkdir -p previous-update
            gh release download "$lingua_previous_tag" --pattern build-info.json --dir previous-update
            lingua_previous_code="$(jq -r '.versionCode' previous-update/build-info.json)"
            if (( lingua_code < lingua_previous_code )); then lingua_latest='false'; fi
          fi
          printf 'Lingua %s\n\n源码提交：%s\n\n测试、Lint、安装包签名与版本核验通过。安装包与本机调试版使用相同签名。\n\n首次请下载安装此 APK；以后在设置 → 应用更新中检查、下载并交给 Android 确认安装，无需登录 GitHub 或填写 Token。\n' "$lingua_version" "$GITHUB_SHA" > "$RUNNER_TEMP/lingua-release-notes.md"
          if ! gh release view "$lingua_tag" >/dev/null 2>&1; then
            gh release create "$lingua_tag" --draft --target "$GITHUB_SHA" --title "Lingua $lingua_version" --notes-file "$RUNNER_TEMP/lingua-release-notes.md"
          fi
          gh release upload "$lingua_tag" update-package/*.apk update-package/build-info.json update-package/SHA256SUMS update-package/signature.txt --clobber
          gh release edit "$lingua_tag" --draft=false --latest="$lingua_latest"
